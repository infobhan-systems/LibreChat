# Infobhan app layer for LibreChat.
# Prefer: scripts/compose-app.ps1 up -d   (or scripts/compose-app.sh)
# That picks --profile edge-tls or edge-local from DOMAIN_CLIENT.
# Manual:
#   docker compose -f docker-compose.yml -f docker-compose.infobhan.yml --profile edge-local up -d
# Do not start observability here. Use docker-compose.observability.yml on the obs host.
#
# DOMAIN_CLIENT https://… (non-localhost) → edge-tls (80/443).
# Otherwise → edge-local (host 3000 → nginx 80).
# LANGFUSE_BASE_URL = http://<OBS_PRIVATE_HOST>:3001 (private), never the public watch URL.
# Set OBS_PRIVATE_HOST to the observability machine private IP.

x-nginx-common: &nginx-common
  image: nginx:1.27.0-alpine
  restart: always
  depends_on:
    - api
    - admin-panel
  environment:
    OBS_PRIVATE_HOST: ${OBS_PRIVATE_HOST:-host.docker.internal}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./nginx/infobhan.tls.conf.template:/etc/nginx/templates/infobhan.tls.conf.template:ro
    - ./nginx/infobhan.local.conf.template:/etc/nginx/templates/infobhan.local.conf.template:ro
    - ./nginx/docker-entrypoint.sh:/docker-entrypoint-infobhan.sh:ro
    - ./nginx/certs:/etc/nginx/ssl:ro
    - ./nginx/certbot/www:/var/www/certbot:ro
  entrypoint: ["/bin/sh", "/docker-entrypoint-infobhan.sh"]

services:
  api:
    depends_on:
      mongodb:
        condition: service_started
      rag_api:
        condition: service_started
      ollama:
        condition: service_healthy
    # Host publish for private Prometheus scrape only; browsers use nginx.
    ports:
      - "${APP_METRICS_BIND:-0.0.0.0}:${PORT:-3080}:${PORT:-3080}"
    environment:
      - APP_TITLE=${APP_TITLE:-Infobhan AI}
      - CUSTOM_FOOTER=${CUSTOM_FOOTER:-Infobhan AI}
      - INFOBHAN_ASSET_V=infobhan2
      # Stock image: brand title/meta on read (dist often not writable under UID:GID).
      - NODE_OPTIONS=--require /app/branding/fs-title-preload.js
    # Optional on-disk patch when writable; preload is the reliable path.
    command:
      - /bin/sh
      - -c
      - node /app/branding/apply-shell-branding.js; exec npm run backend
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./branding/apply-shell-branding.js
        target: /app/branding/apply-shell-branding.js
        read_only: true
      - type: bind
        source: ./branding/fs-title-preload.js
        target: /app/branding/fs-title-preload.js
        read_only: true
      # Runtime branding evidence (create empty file on host before up).
      - type: bind
        source: ./debug-2a1742.log
        target: /app/debug-2a1742.log
      # Infobhan AI mark: AuthLayout loads /assets/logo.svg from the built client.
      - type: bind
        source: ./branding/logo.svg
        target: /app/client/dist/assets/logo.svg
      - type: bind
        source: ./branding/logo.svg
        target: /app/client/public/assets/logo.svg
      # Favicons / PWA icons (stock image still ships LibreChat feather icons).
      - type: bind
        source: ./branding/icons/favicon-16x16.png
        target: /app/client/dist/assets/favicon-16x16.png
      - type: bind
        source: ./branding/icons/favicon-32x32.png
        target: /app/client/dist/assets/favicon-32x32.png
      - type: bind
        source: ./branding/icons/apple-touch-icon-180x180.png
        target: /app/client/dist/assets/apple-touch-icon-180x180.png
      - type: bind
        source: ./branding/icons/icon-192x192.png
        target: /app/client/dist/assets/icon-192x192.png
      - type: bind
        source: ./branding/icons/maskable-icon.png
        target: /app/client/dist/assets/maskable-icon.png

  # InfobhanAI Admin Panel chrome (title, sidebar logo, favicon) on the stock image.
  # No host ports: only nginx reaches admin-panel:3000 (avoids clash with edge-local :3000).
  admin-panel:
    ports: !reset []
    environment:
      - PORT=3000
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3000}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
    command:
      - /bin/sh
      - -c
      - bun /branding/apply-admin-branding.js && exec bun server.ts
    volumes:
      - type: bind
        source: ./branding/apply-admin-branding.js
        target: /branding/apply-admin-branding.js
        read_only: true
      - type: bind
        source: ./branding/admin-title-logo.png
        target: /branding/admin-title-logo.png
        read_only: true

  # Real DOMAIN_CLIENT (https://, non-localhost): 80 ACME+redirect, 443 TLS.
  nginx-tls:
    <<: *nginx-common
    profiles: ["edge-tls"]
    environment:
      OBS_PRIVATE_HOST: ${OBS_PRIVATE_HOST:-host.docker.internal}
      NGINX_EDGE_MODE: tls
    ports:
      - "80:80"
      - "443:443"

  # Local test DOMAIN_CLIENT (e.g. http://localhost:3000): HTTP only on host 3000.
  nginx-local:
    <<: *nginx-common
    profiles: ["edge-local"]
    environment:
      OBS_PRIVATE_HOST: ${OBS_PRIVATE_HOST:-host.docker.internal}
      NGINX_EDGE_MODE: local
    ports:
      - "3000:80"

  # Local models for Infobhan. Pulls each model with its own ollama pull.
  # Ministral 3B is loaded for default chat.
  # Use ministral-3:3b (not bare ministral-3 — that resolves to 8B latest).
  # qwen3.5:9b and LFM2.5-VL-3B are downloaded and load when selected.
  # One model at a time on the 16 GB GPU. 32768 matches tokenConfig in librechat.yaml.
  ollama:
    image: ollama/ollama:latest
    restart: always
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [compute, utility]
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ministral-3:3b
        ollama pull mistral-small:24b
        ollama pull qwen3.5:9b
        ollama pull hf.co/LiquidAI/LFM2.5-VL-3B-GGUF:Q4_0
        ollama run ministral-3:3b "hi" </dev/null >/dev/null
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "ollama show ministral-3:3b >/dev/null 2>&1 && ollama show qwen3.5:9b >/dev/null 2>&1 && ollama show hf.co/LiquidAI/LFM2.5-VL-3B-GGUF:Q4_0 >/dev/null 2>&1 && ollama ps | grep -q ministral"]
      interval: 10s
      timeout: 10s
      retries: 150
      start_period: 30s

  # Host CPU / RAM / disk / network for Prometheus on the observability machine.
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: always
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_BIND:-0.0.0.0}:9100:9100"

  # Host GPU util / VRAM / temperature for Prometheus on the observability machine.
  nvidia_gpu_exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.1
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [compute, utility]
    ports:
      - "${NVIDIA_GPU_EXPORTER_BIND:-0.0.0.0}:9835:9835"

  # Per-model VRAM from Ollama /api/ps. Scraped by observability Prometheus.
  ollama-exporter:
    build:
      context: ./observability/ollama-exporter
    image: librechat-ollama-exporter:local
    restart: always
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LISTEN_ADDR: 0.0.0.0:11435
      POLL_INTERVAL_SECONDS: "15"
    ports:
      - "${OLLAMA_EXPORTER_BIND:-0.0.0.0}:11435:11435"
