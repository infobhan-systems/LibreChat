# Infobhan GPU / observability exporters layer.
# Prefer: scripts/compose-app.ps1 up -d   (or scripts/compose-app.sh)
# edge-tls (real DOMAIN_CLIENT) merges this file automatically.
# edge-local (laptop) uses docker-compose.yml only; pass -WithGpu / --with-gpu to merge.
# Manual:
#   docker compose -f docker-compose.yml -f docker-compose.infobhan.yml --profile edge-tls up -d
# Do not start observability here. Use docker-compose.observability.yml on the obs host.
#
# Nginx edge lives in docker-compose.yml (edge-local / edge-tls profiles).
# LANGFUSE_BASE_URL = http://<OBS_PRIVATE_HOST>:3001 (private), never the public watch URL.
# Set OBS_PRIVATE_HOST to the observability machine private IP.

services:
  api:
    depends_on:
      mongodb:
        condition: service_started
      rag_api:
        condition: service_started
      ollama:
        condition: service_healthy
    # Host publish for private Prometheus scrape only; browsers use nginx.
    ports:
      - "${APP_METRICS_BIND:-0.0.0.0}:${PORT:-3080}:${PORT:-3080}"

  # Local models for Infobhan. Pulls each model with its own ollama pull.
  # Ministral 3B is loaded for default chat.
  # Use ministral-3:3b (not bare ministral-3 — that resolves to 8B latest).
  # qwen3.5:9b and LFM2.5-VL-3B are downloaded and load when selected.
  # One model at a time on the 16 GB GPU. 32768 matches tokenConfig in librechat.yaml.
  ollama:
    image: ollama/ollama:latest
    restart: always
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [compute, utility]
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ministral-3:3b
        ollama pull mistral-small:24b
        ollama pull qwen3.5:9b
        ollama pull hf.co/LiquidAI/LFM2.5-VL-3B-GGUF:Q4_0
        ollama run ministral-3:3b "hi" </dev/null >/dev/null
        wait $$pid
    healthcheck:
      test: ["CMD-SHELL", "ollama show ministral-3:3b >/dev/null 2>&1 && ollama show qwen3.5:9b >/dev/null 2>&1 && ollama show hf.co/LiquidAI/LFM2.5-VL-3B-GGUF:Q4_0 >/dev/null 2>&1 && ollama ps | grep -q ministral"]
      interval: 10s
      timeout: 10s
      retries: 150
      start_period: 30s

  # Host CPU / RAM / disk / network for Prometheus on the observability machine.
  # Use :ro only — :ro,rslave needs shared/slave root mounts (Linux hosts).
  # Docker Desktop (Windows/macOS) rejects rslave with:
  #   path / is mounted on / but it is not a shared or slave mount
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: always
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_BIND:-0.0.0.0}:9100:9100"

  # Host GPU util / VRAM / temperature for Prometheus on the observability machine.
  nvidia_gpu_exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.1
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [compute, utility]
    ports:
      - "${NVIDIA_GPU_EXPORTER_BIND:-0.0.0.0}:9835:9835"

  # Per-model VRAM from Ollama /api/ps. Scraped by observability Prometheus.
  ollama-exporter:
    build:
      context: ./observability/ollama-exporter
    image: librechat-ollama-exporter:local
    restart: always
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LISTEN_ADDR: 0.0.0.0:11435
      POLL_INTERVAL_SECONDS: "15"
    ports:
      - "${OLLAMA_EXPORTER_BIND:-0.0.0.0}:11435:11435"
