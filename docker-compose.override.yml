# Please consult our docs for more info: https://www.librechat.ai/docs/configuration/docker_override

# TO USE THIS FILE, FIRST UNCOMMENT THE LINE ('services:')

# THEN UNCOMMENT ONLY THE SECTION OR SECTIONS CONTAINING THE CHANGES YOU WANT TO APPLY
# SAVE THIS FILE AS 'docker-compose.override.yaml'
# AND USE THE 'docker compose build' & 'docker compose up -d' COMMANDS AS YOU WOULD NORMALLY DO

# WARNING: YOU CAN ONLY SPECIFY EVERY SERVICE NAME ONCE (api, mongodb, meilisearch, ...)
# IF YOU WANT TO OVERRIDE MULTIPLE SETTINGS IN ONE SERVICE YOU WILL HAVE TO EDIT ACCORDINGLY

# EXAMPLE: if you want to use the config file and the latest numbered release docker image the result will be:

# services:
#   api:
#     volumes:
#     - type: bind
#       source: ./librechat.yaml
#       target: /app/librechat.yaml
#     image: registry.librechat.ai/librechat-ai/librechat:latest

# ---------------------------------------------------

services:

# # USE LIBRECHAT CONFIG FILE
 api:
   depends_on:
     mongodb:
       condition: service_started
     rag_api:
       condition: service_started
     ollama:
       condition: service_healthy
   volumes:
   - type: bind
     source: ./librechat.yaml
     target: /app/librechat.yaml


# # ADD OLLAMA
# Pulls each model with its own ollama pull. Mistral is loaded for the default chat.
# qwen3.5:9b and LFM2.5-VL-3B are downloaded and load when selected.
# The 6 GB GPU cannot hold qwen3.5:9b together with another model.
 ollama:
   image: ollama/ollama:latest
   restart: always
   environment:
     OLLAMA_KEEP_ALIVE: "-1"
     OLLAMA_MAX_LOADED_MODELS: "1"
   deploy:
     resources:
       reservations:
         devices:
           - driver: nvidia
             capabilities: [compute, utility]
   ports:
     - "11434:11434"
   volumes:
     - ./ollama:/root/.ollama
   entrypoint: ["/bin/sh", "-c"]
   command:
     - |
       set -eu
       ollama serve &
       pid=$$!
       until ollama list >/dev/null 2>&1; do sleep 1; done
       ollama pull mistral
       ollama pull qwen3.5:9b
       ollama pull hf.co/LiquidAI/LFM2.5-VL-3B-GGUF:Q4_0
       ollama run mistral "hi" </dev/null >/dev/null
       wait $$pid
   healthcheck:
     test: ["CMD-SHELL", "ollama show mistral >/dev/null 2>&1 && ollama show qwen3.5:9b >/dev/null 2>&1 && ollama show hf.co/LiquidAI/LFM2.5-VL-3B-GGUF:Q4_0 >/dev/null 2>&1 && ollama ps | grep -q mistral"]
     interval: 10s
     timeout: 10s
     retries: 150
     start_period: 30s

