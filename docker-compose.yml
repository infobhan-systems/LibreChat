# Infobhan app stack. Prefer: scripts/compose-app.ps1 up -d (or scripts/compose-app.sh).
# That picks --profile edge-tls or edge-local from DOMAIN_CLIENT.
# Manual local (no GPU / Ollama):
#   docker compose -f docker-compose.yml --profile edge-local up -d
# GPU host still merges docker-compose.infobhan.yml (Ollama, exporters).
# Do not start observability here. Use docker-compose.observability.yml on the obs host.
#
# DOMAIN_CLIENT https://… (non-localhost) → edge-tls (80/443).
# Otherwise → edge-local (host 3000 → nginx 80).
# edge-tls server_name hosts come from DOMAIN_CLIENT and ADMIN_PANEL_URL (must differ).
# TLS edge does not proxy Langfuse/Grafana; LANGFUSE_BASE_URL stays private (:3001).
# Set OBS_PRIVATE_HOST for local-edge watch.localhost proxy (and app→obs reachability).

x-nginx-common: &nginx-common
  image: nginx:1.27.0-alpine
  restart: always
  depends_on:
    - api
    - admin-panel
  environment:
    OBS_PRIVATE_HOST: ${OBS_PRIVATE_HOST:-host.docker.internal}
    DOMAIN_CLIENT: ${DOMAIN_CLIENT:-}
    ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./nginx/infobhan.tls.conf.template:/etc/nginx/templates/infobhan.tls.conf.template:ro
    - ./nginx/infobhan.local.conf.template:/etc/nginx/templates/infobhan.local.conf.template:ro
    - ./nginx/docker-entrypoint.sh:/docker-entrypoint-infobhan.sh:ro
    - ./nginx/certs:/etc/nginx/ssl:ro
    - ./nginx/certbot/www:/var/www/certbot:ro
  entrypoint: ["/bin/sh", "/docker-entrypoint-infobhan.sh"]

services:
  api:
    container_name: infobhan-ai
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
    image: registry.librechat.ai/librechat-ai/librechat-dev:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - APP_TITLE=${APP_TITLE:-Infobhan AI}
      - CUSTOM_FOOTER=${CUSTOM_FOOTER:-Infobhan AI}
      - INFOBHAN_ASSET_V=infobhan2
      # Stock image: brand title/meta on read (dist often not writable under UID:GID).
      - NODE_OPTIONS=--require /app/branding/fs-title-preload.js
    # Optional on-disk patch when writable; preload is the reliable path.
    command:
      - /bin/sh
      - -c
      - node /app/branding/apply-shell-branding.js; exec npm run backend
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
      - librechat-data:/app/data
      - type: bind
        source: ./branding/apply-shell-branding.js
        target: /app/branding/apply-shell-branding.js
        read_only: true
      - type: bind
        source: ./branding/fs-title-preload.js
        target: /app/branding/fs-title-preload.js
        read_only: true
      # Runtime branding evidence (create empty file on host before up).
      - type: bind
        source: ./debug-2a1742.log
        target: /app/debug-2a1742.log
      # Infobhan AI mark: AuthLayout loads /assets/logo.svg from the built client.
      - type: bind
        source: ./branding/logo.svg
        target: /app/client/dist/assets/logo.svg
      - type: bind
        source: ./branding/logo.svg
        target: /app/client/public/assets/logo.svg
      # Favicons / PWA icons (stock image still ships LibreChat feather icons).
      - type: bind
        source: ./branding/icons/favicon-16x16.png
        target: /app/client/dist/assets/favicon-16x16.png
      - type: bind
        source: ./branding/icons/favicon-32x32.png
        target: /app/client/dist/assets/favicon-32x32.png
      - type: bind
        source: ./branding/icons/apple-touch-icon-180x180.png
        target: /app/client/dist/assets/apple-touch-icon-180x180.png
      - type: bind
        source: ./branding/icons/icon-192x192.png
        target: /app/client/dist/assets/icon-192x192.png
      - type: bind
        source: ./branding/icons/maskable-icon.png
        target: /app/client/dist/assets/maskable-icon.png
  # No host ports: only nginx reaches admin-panel:3000 (avoids clash with edge-local :3000).
  admin-panel:
    container_name: admin-panel
    image: registry.librechat.ai/librechat-ai/librechat-admin-panel:latest
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3000}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
    # InfobhanAI Admin Panel chrome (title, sidebar logo, favicon) on the stock image.
    command:
      - /bin/sh
      - -c
      - bun /branding/apply-admin-branding.js && exec bun server.ts
    volumes:
      - type: bind
        source: ./branding/apply-admin-branding.js
        target: /branding/apply-admin-branding.js
        read_only: true
      - type: bind
        source: ./branding/admin-title-logo.png
        target: /branding/admin-title-logo.png
        read_only: true
  mongodb:
    container_name: chat-mongodb
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: rag_api
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

  # Real DOMAIN_CLIENT (https://, non-localhost): 80 ACME+redirect, 443 TLS.
  nginx-tls:
    <<: *nginx-common
    profiles: ["edge-tls"]
    environment:
      OBS_PRIVATE_HOST: ${OBS_PRIVATE_HOST:-host.docker.internal}
      DOMAIN_CLIENT: ${DOMAIN_CLIENT:-}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-}
      NGINX_EDGE_MODE: tls
    ports:
      - "80:80"
      - "443:443"

  # Local test DOMAIN_CLIENT (e.g. http://localhost:3000): HTTP only on host 3000.
  nginx-local:
    <<: *nginx-common
    profiles: ["edge-local"]
    environment:
      OBS_PRIVATE_HOST: ${OBS_PRIVATE_HOST:-host.docker.internal}
      DOMAIN_CLIENT: ${DOMAIN_CLIENT:-}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-}
      NGINX_EDGE_MODE: local
    ports:
      - "3000:80"

volumes:
  pgdata2:
  librechat-data:
